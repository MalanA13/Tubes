apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        # Jika menggunakan Azure (ACR), ubah image di bawah ini menjadi:
        # image: namakampusacr.azurecr.io/logistics-order:latest
        image: logistics-order:latest
        # Gunakan imagePullPolicy: Never atau IfNotPresent jika test di minikube lokal
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: TRACKING_SVC_URL
          value: "http://tracking-service:8080"
        - name: ORDER_SVC_URL
          value: "http://order-service:8080"
        - name: AUTH_SVC_URL
          value: "http://auth-service:8080"
        - name: PRICING_SVC_URL
          value: "http://pricing-service:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP
