apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth-container
        image: muhiban/auth-service:v1 # Image yang kamu push tadi
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: LoadBalancer # Agar bisa diakses lewat IP mesin/Node
  selector:
    app: auth
  ports:
    - protocol: TCP
      port: 8087      # Port internal cluster
      targetPort: 8080
      # nodePort: 30087 # Gunakan angka 87 agar konsisten dengan port 8087 service ini