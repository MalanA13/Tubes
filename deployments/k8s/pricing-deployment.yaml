apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-deployment
  labels:
    app: pricing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pricing-service
  template:
    metadata:
      labels:
        app: pricing-service
    spec:
      containers:
      - name: pricing-service
        # Jika menggunakan Azure (ACR), ubah image di bawah ini menjadi:
        # image: namakampusacr.azurecr.io/logistics-pricing:latest
        image: logistics-pricing:latest
        # Gunakan imagePullPolicy: Never atau IfNotPresent jika test di minikube lokal
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: PORT
          value: "8082"
        - name: TRACKING_SVC_URL
          value: "http://tracking-service:8083"
        - name: ORDER_SVC_URL
          value: "http://order-service:8081"
        - name: AUTH_SVC_URL
          value: "http://auth-service:8087"
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-service
spec:
  selector:
    app: pricing-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP
