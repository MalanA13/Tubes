apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-services-deployment
  labels:
    app: mock-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-services
  template:
    metadata:
      labels:
        app: mock-services
    spec:
      containers:
      - name: mock-services
        image: hashicorp/http-echo:latest
        args:
        - "-text={\"role\":\"admin\"}"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: mock-services
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
spec:
  selector:
    app: mock-services
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: mock-services
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
